
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Person</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="stars">✨ ⭐ ✨</div>

        <h1>Hey, Lucky Person! 💖</h1>

        <h2>You are the luckiest person in the universe!</h2>

        <p>
            The universe has billions of stars,
            but someone like you is truly special.
            Keep smiling and spreading happiness!
        </p>

        <button onclick="showSurprise()">
            Click for a Surprise 🎁
        </button>

        <h3 id="surprise"></h3>

        <div class="footer">
            Made with ❤️ just for you
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
